name: Refresh contribution heatmap

# Runs every day at 06:17 UTC, on every push to main,
# and can be triggered manually from the Actions tab.
"on":
  schedule:
    - cron: "17 6 * * *"     # ~11:17 PKT — fresh for your evening posting window
  workflow_dispatch: {}       # manual trigger
  push:
    branches: [main]

permissions:
  contents: write             # lets the bot commit back to the repo

jobs:
  heatmap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements-ci.txt

      - name: Install dependencies (CI — no torch/rembg)
        run: pip install -r scripts/requirements-ci.txt

      - name: Fetch contribution data
        run: python scripts/fetch_contributions.py

      - name: Render heatmap SVG
        run: python scripts/render_heatmap_svg.py

      # Commits only when the files actually changed
      - name: Commit updated heatmap
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
          commit_user_name: "profile-art-bot"
          commit_user_email: "actions@github.com"
